services:
  llm-backend:
    image: ollama/ollama:latest
    container_name: mtm-ollama
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    ports:
      - "11434:11434"
    restart: always

  # Service to auto-pull the model on startup
  model-puller:
    image: curlimages/curl
    container_name: mtm-model-puller
    command: >
      /bin/sh -c "
      echo 'Waiting for Ollama to start...';
      sleep 5;
      echo 'Pulling llama3.3:70b...';
      curl -X POST http://llm-backend:11434/api/pull -d '{\"name\": \"llama3.3:70b\"}';
      echo 'Model pulled successfully!';"
    depends_on:
      - llm-backend

  frontend:
    build:
      context: ./frontend
    container_name: mtm-gpt-frontend
    ports:
      - "3000:3000"
    depends_on:
      - llm-backend
    environment:
      # Ollama OpenAI-compatible endpoint
      - VITE_API_URL=http://localhost:11434/v1
    restart: always

volumes:
  ollama_models:
